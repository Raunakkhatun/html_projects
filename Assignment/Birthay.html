<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthay Invitation Card</title>
    <style>
        body{
            font-family: 'quickstand' sans-serif;
            margin: 0;
            height: 100vh;
            background:linear-gradient(135deg,#ffe0ec,#f9f3f3);
            display: flex;
            justify-content: center;
            
        }

        .container{
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0px 8px 30px rgb(0,0,0,0.15);
            
        }

        .box1{
            font-size: 25px;
            color:lightcoral;
            margin-bottom: 20px;
             font-family:'Times New Roman', Times, serif 
        }

        .box2{
            font-family: 'playfair Display', serif;
            font-size: 35px;
            color: #b23b6d;
        }

        .box3{
            font-size: 25px;
            color: cornflowerblue;
            margin: 15px 0;
            font-weight: bold;
        }
        
        .photo{
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid #f7c1d9;
            margin-bottom: 30px;
            object-fit: cover;
        }
        .vanue{
            font-size: 20px ;
            margin: 20px 0;
            color:#b23b6d;
        }
        .date{
            font-size: 20px ;
            margin: 20px 0;
            color: #b23b6d;

        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: #b23b6d; border: 2px dotted; background-color: #f7c1d9; ">Birthay Invitation Card</h1>
        <img src="raunak.jpg" alt="pic" height="200px" width="200px" class="photo">
        <div class="box1" > Happy Birthay To Raunak</div>
        <div class="box2">18th Birthay Celebration</div>
        <div class="box3">You are cordially invited raunak's birthay party!</div>
        <div class="vanue">Venue:-patna,Gaurichak</div>
        <div class="date">Date:-25 May 2025 | Time:- 7:PM
        </div>
    
    </div>
</body>
</html>
