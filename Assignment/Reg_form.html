<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addmission form</title>
</head>
<body>
    <h1><center><strong>Satyam International Institute of Technology & Managment</strong></center></h1>
    <p><center><strong>Gaurichak patna-800007,Bihar</strong></center></p>
    <img src="collage.jpeg" alt="satyam logo" height="150px" width="150px" >
    <hr>
    <br><br>
    <form>
        <label>Name</label>
        <input type="text" name="name">

        <label>Mobile No.</label>
        <input type="tel" name="mobile">

        <label>Email</label>
        <input type="email" name="email">
    
        <label>Date of birth</label>
        <input type="date" name="dob">
        <br><br>
        <label>Father Name</label>
        <input type="text" name="father_name">
    
        <label>Mother Name</label>
        <input type="text" name="mother_name">
        
        <label>Gender</label>
        <select>
            <option>select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>other</option>
        </select>
    
        <label>Category</label>
        <select>
            <option>select category</option>
            <option>Genral</option>
            <option>OBC</option>
            <option>SC</option>
            <option>ST</option>
        </select>
        <br><br>
    
        <label>Address</label>
        <input type="text" name="Address">
        
        <label>City</label>
        <input type="text" name="city">
        
        <label>Pin code</label>
        <input type="text" name="pin">
    
        <label>Adhar No.</label>
        <input type="text" name="adhar">
        <br><br>
        
        <label>Remarks if any</label>
        <input type="text" name="remarks">
        
        <label>Programme</label>
        <select>
            <option>select programme</option>
            <option>Diploma</option>
            <option>BCA</option>
            <option>other</option>
        </select> 
        <br><br>
        
        <h3>Educational qualification</h3>
        <label>Course</label>
        <input type="text" name="course">
    
        <label>Subjects</label>
        <input type="text" name="subjects">

        <label>Board Name</label>
        <input type="text" name="Board">
    
        <label>Passing year</label>
        <input type="text" name="passing_year">
        <br><br>
        
        <label>Result type</label>
        <select>
            <option>Select Result</option>
            <option>Pass</option>
            <option>Fail</option>
            <option>Awaited</option>
        </select>
        
        <label>Upload photo</label>
        <input type="file" name="photo">
        
        <label>Upload Signature</label>
        <input type="file" name="signature">
        <br><br>
        
        <button type="sumbit">sumbit</button>


    </form>
    
</body>
</html>
